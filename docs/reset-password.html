<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>Continue your LocTag password reset</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f8f6fc;
        color: #2f1a68;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 440px);
        padding: 36px 28px;
        border: 1px solid #ddcff9;
        border-radius: 22px;
        background: #ffffff;
        box-shadow: 0 12px 36px rgba(47, 26, 104, 0.12);
        text-align: center;
      }

      .brand {
        display: inline-grid;
        place-items: center;
        width: 76px;
        height: 76px;
        margin-bottom: 14px;
        border-radius: 24px;
        background: #7000ff;
        color: #ffffff;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -1px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 27px;
        line-height: 1.18;
      }

      p {
        margin: 0;
        color: #6e6778;
        font-size: 16px;
        line-height: 1.5;
      }

      button {
        width: 100%;
        margin: 28px 0 16px;
        padding: 16px 20px;
        border: 0;
        border-radius: 999px;
        background: #7000ff;
        color: #ffffff;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid #b890ff;
        outline-offset: 3px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .status {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-hidden="true">LT</div>
      <h1>Continue your password reset</h1>
      <p>Open LocTag on this device to choose a new password.</p>
      <button id="open-loctag" type="button">OPEN LOCTAG</button>
      <p id="status" class="status" role="status">
        If LocTag does not open, make sure the app is installed and try again.
      </p>
    </main>

    <script>
      (() => {
        const button = document.getElementById("open-loctag");
        const status = document.getElementById("status");
        const callbackData = `${window.location.search}${window.location.hash}`;
        const hasCallbackData =
          /(?:[?#&](?:access_token|refresh_token|code|error|error_code|error_description)=)/.test(
            callbackData,
          );

        if (!hasCallbackData) {
          button.disabled = true;
          status.textContent =
            "This password-reset link is incomplete or has expired. Request a new link in LocTag.";
          return;
        }

        button.addEventListener("click", () => {
          status.textContent = "Opening LocTag…";
          window.location.assign(`loctag://reset-password${callbackData}`);
        });
      })();
    </script>
  </body>
</html>
