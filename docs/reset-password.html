<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>Continue your LocTag password reset</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f8f6fc;
        color: #2f1a68;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 440px);
        padding: 36px 28px;
        border: 1px solid #ddcff9;
        border-radius: 22px;
        background: #ffffff;
        box-shadow: 0 12px 36px rgba(47, 26, 104, 0.12);
        text-align: center;
      }

      .brand {
        display: inline-grid;
        place-items: center;
        width: 76px;
        height: 76px;
        margin-bottom: 14px;
        border-radius: 24px;
        background: #7000ff;
        color: #ffffff;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -1px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 27px;
        line-height: 1.18;
      }

      p {
        margin: 0;
        color: #6e6778;
        font-size: 16px;
        line-height: 1.5;
      }

      .open-button {
        display: block;
        width: 100%;
        margin: 28px 0 16px;
        padding: 16px 20px;
        border: 0;
        border-radius: 999px;
        background: #7000ff;
        color: #ffffff;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        text-decoration: none;
      }

      .open-button:focus-visible {
        outline: 3px solid #b890ff;
        outline-offset: 3px;
      }

      .open-button[aria-disabled="true"] {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .status {
        font-size: 14px;
      }

      .version {
        margin-top: 12px;
        font-size: 12px;
        color: #958da0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-hidden="true">LT</div>
      <h1>Continue your password reset</h1>
      <p>Open LocTag on this device to choose a new password.</p>
      <a id="open-loctag" class="open-button" role="button">OPEN LOCTAG</a>
      <p id="status" class="status" role="status">
        If LocTag does not open, make sure the app is installed and try again.
      </p>
      <p class="version">Recovery handoff v16.8</p>
    </main>

    <script>
      (() => {
        const openLink = document.getElementById("open-loctag");
        const status = document.getElementById("status");
        const callbackParameters = new URLSearchParams(window.location.search);
        const fragmentParameters = new URLSearchParams(
          window.location.hash.replace(/^#/, ""),
        );

        fragmentParameters.forEach((value, key) => {
          if (!callbackParameters.has(key)) {
            callbackParameters.append(key, value);
          }
        });

        const hasCallbackData = [
          "access_token",
          "refresh_token",
          "code",
          "error",
          "error_code",
          "error_description",
        ].some((key) => callbackParameters.has(key));

        if (!hasCallbackData) {
          openLink.setAttribute("aria-disabled", "true");
          status.textContent =
            "This password-reset link is incomplete or has expired. Request a new link in LocTag.";
          return;
        }

        const serializedParameters = callbackParameters.toString();
        const customSchemeUrl =
          `loctag://reset-password?${serializedParameters}`;
        const androidIntentUrl =
          `intent://reset-password?${serializedParameters}` +
          "#Intent;scheme=loctag;package=app.loctag;end";

        openLink.href = /Android/i.test(navigator.userAgent)
          ? androidIntentUrl
          : customSchemeUrl;

        openLink.addEventListener("click", () => {
          status.textContent = "Opening LocTag…";
        });
      })();
    </script>
  </body>
</html>
